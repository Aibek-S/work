[package]
name = "work"
version = "0.1.0"
edition = "2024"
description = "Minimal terminal focus timer with built-in white, pink and brown noise"
license = "MIT"
repository = "https://github.com/Aibek-S/work"
readme = "README.md"
keywords = ["tui", "pomodoro", "focus", "timer", "noise"]
categories = ["command-line-utilities"]

[dependencies]
cpal = "0.18.2"
lexopt = "0.3.2"
ratatui = { version = "0.30.2", default-features = false, features = ["crossterm"] }
serde = { version = "1.0.229", features = ["derive"] }
signal-hook = { version = "0.4.5", default-features = false }
toml = { version = "1.1.8", default-features = false, features = ["parse", "serde", "std"] }

[profile.release]
lto = true
codegen-units = 1
strip = true
